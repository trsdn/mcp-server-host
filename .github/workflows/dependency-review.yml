# Scans pull requests for vulnerable or license-incompatible dependencies before merging.
#
# Requires "Dependency graph" to be enabled under
# Settings -> Advanced Security. Without it the action fails with
# "Dependency review is not supported on this repository". This is a repository setting,
# not something the workflow can turn on.

name: 'Dependency Review'

on:
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

          # This project ships under MIT; copyleft transitive dependencies would make the
          # published packages unusable for most consumers.
          license-check: true
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, BlueOak-1.0.0, LicenseRef-scancode-generic-cla

          comment-summary-in-pr: always
          warn-only: false
          fail-on-scopes: runtime, development

          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
